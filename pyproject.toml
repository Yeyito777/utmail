[project]
name = "utmail-helper"
version = "0.3.1"
description = "Unofficial read-only OWA CLI with a private renewable browser session"
readme = "README.md"
license = "MIT"
authors = [{ name = "Aurelio Linero Barcenas" }]
requires-python = ">=3.11"
dependencies = [
  "playwright==1.58.0",
  "requests>=2.32,<3",
]

[project.urls]
Homepage = "https://github.com/Yeyito777/utmail"
Repository = "https://github.com/Yeyito777/utmail"
Issues = "https://github.com/Yeyito777/utmail/issues"

[project.scripts]
utmail = "utmail_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/utmail_tool"]
