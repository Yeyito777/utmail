[project]
name = "utmail-helper"
version = "0.4.0"
description = "Unofficial read-only OWA CLI with renewable authentication delegated to vimbrowser"
readme = "README.md"
license = "MIT"
authors = [{ name = "Aurelio Linero Barcenas" }]
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3"]

[project.urls]
Homepage = "https://github.com/Yeyito777/utmail"
Repository = "https://github.com/Yeyito777/utmail"
Issues = "https://github.com/Yeyito777/utmail/issues"

[project.scripts]
utmail = "utmail_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/utmail_tool"]
